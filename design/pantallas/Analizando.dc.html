<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AlToque · Analizando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#0B5FA5}a:hover{color:#084A82}
a:focus-visible,button:focus-visible{outline:3px solid #0B5FA5;outline-offset:2px}
@keyframes at-spin{to{transform:rotate(360deg)}}
@keyframes at-halo{0%{transform:scale(0.94);opacity:0.6}100%{transform:scale(1.22);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F7FA;color:#0B2340;font-family:Inter,system-ui,-apple-system,sans-serif">
  <div style="padding:40px 12px 0 8px;flex-shrink:0">
    <div style="display:flex;align-items:center;height:56px">
      <a href="Main.dc.html" aria-label="Cancelar y volver al inicio" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#0B2340;text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></a>
    </div>
  </div>

  <main style="flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px;gap:18px">
    <div style="position:relative;width:148px;height:148px;margin-top:4px">
      <div style="position:absolute;inset:0;border-radius:999px;background:#CFE0F1;animation:at-halo 2.2s ease-out infinite"></div>
      <svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true" style="position:absolute;inset:0;animation:at-spin 1.6s linear infinite"><circle cx="74" cy="74" r="69" fill="none" stroke="#CFE0F1" stroke-width="6"/><path d="M74 5a69 69 0 0 1 69 69" fill="none" stroke="#0B5FA5" stroke-width="6" stroke-linecap="round"/></svg>
      <div style="position:absolute;left:14px;top:14px;width:120px;height:120px;border-radius:999px;overflow:hidden;background:#0B2340">
        <svg width="160" height="120" viewBox="0 0 112 84" role="img" aria-label="Tu foto de la llanta" style="margin-left:-20px;display:block"><rect width="112" height="84" fill="#0B2340"/><circle cx="96" cy="10" r="26" fill="#CFE0F1" opacity="0.14"/><path d="M0 16H112V54H86A36 36 0 0 0 14 54H0Z" fill="#24456B"/><rect y="70" width="112" height="14" fill="#142C4A"/><path d="M20 71C18 52 31 37 50 37S82 52 80 71Z" fill="#06152A" stroke="#4E6C8E" stroke-width="2"/><ellipse cx="50" cy="71" rx="31" ry="3.5" fill="#06152A"/><circle cx="50" cy="56" r="12" fill="#8FA7C2"/><circle cx="50" cy="56" r="4" fill="#CFE0F1"/></svg>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;text-align:center">
      <h1 style="margin:0;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:27px;line-height:33px">Estamos revisando tu caso</h1>
      <p style="margin:0;font-size:17px;line-height:25px;color:#4B5D73">Respira. En unos segundos te decimos qué hacer.</p>
    </div>

    <div aria-live="polite" style="align-self:stretch;display:flex;flex-direction:column;gap:2px;padding:10px 18px;border-radius:20px;background:#FFFFFF;border:1px solid #E1E8F0">
      <sc-for list="{{pasos}}" as="p" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:12px;min-height:44px">
          <sc-if value="{{p.hecho}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12703D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.5"/></svg></sc-if>
          <sc-if value="{{p.activo}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="animation:at-spin 0.9s linear infinite"><circle cx="12" cy="12" r="9" fill="none" stroke="#CFE0F1" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="#0B5FA5" stroke-width="3" stroke-linecap="round"/></svg></sc-if>
          <sc-if value="{{p.pendiente}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A8BA1" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></sc-if>
          <span style="font-size:16px;line-height:22px;font-weight:{{p.peso}};color:{{p.color}}">{{p.texto}}</span>
        </div>
      </sc-for>
    </div>

    <div style="align-self:stretch;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:#CFE0F1">
      <span style="width:44px;height:44px;flex-shrink:0;border-radius:999px;background:#F2A900;color:#0B2340;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10l-3.8 6.5h7.6L12 10z"/></svg></span>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:14px;font-weight:700;line-height:19px">Mientras tanto</span>
        <span style="font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:19px;line-height:24px">Enciende las luces de emergencia</span>
        <span style="font-size:15px;line-height:21px">Es el botón con un triángulo rojo en el tablero.</span>
      </div>
    </div>
  </main>

  <div style="flex-shrink:0;padding:12px 20px 28px">
    <sc-if value="{{listo}}" hint-placeholder-val="{{ false }}">
      <a href="Preguntas.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:16px;background:#0B5FA5;color:#FFFFFF;text-decoration:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:19px;box-shadow:0 6px 16px rgba(11,95,165,0.24)">
        <span>Continuar</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{analizando}}" hint-placeholder-val="{{ true }}">
      <p style="margin:0;min-height:56px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#4B5D73">Esto toma unos segundos…</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const f = (this.state && this.state.fase) || 0;
      if (f >= 3) { clearInterval(this.timer); return; }
      this.setState({ fase: f + 1 });
    }, 1200);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const fase = (this.state && this.state.fase) || 0;
    const textos = ['Revisando tu foto', 'Comparando con casos parecidos', 'Preparando unas preguntas'];
    return {
      listo: fase >= 3,
      analizando: fase < 3,
      pasos: textos.map((t, i) => ({
        texto: t,
        hecho: fase > i,
        activo: fase === i,
        pendiente: fase < i,
        peso: fase === i ? '700' : '500',
        color: fase < i ? '#4B5D73' : '#0B2340'
      }))
    };
  }
}
</script>
</body>
</html>
