<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AlToque · La foto no se pudo analizar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#0B5FA5}a:hover{color:#084A82}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #0B5FA5;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F7FA;color:#0B2340;font-family:Inter,system-ui,-apple-system,sans-serif">
  <div style="padding:40px 12px 0 8px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:4px;height:56px">
      <a href="Main.dc.html" aria-label="Volver al inicio" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#0B2340;text-decoration:none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 style="margin:0;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:20px;line-height:26px">Cuéntanos qué pasó</h1>
    </div>
  </div>

  <main style="flex:1;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:20px">
    <section aria-label="La foto no se pudo analizar" style="flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:#FFF4D6;border:1px solid #F2A900">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="position:relative;width:96px;height:72px;flex-shrink:0;border-radius:12px;overflow:hidden;background:#06101E">
          <svg width="96" height="72" viewBox="0 0 112 84" aria-hidden="true" style="display:block"><rect width="112" height="84" fill="#06101E"/><path d="M0 16H112V54H86A36 36 0 0 0 14 54H0Z" fill="#0E1E33"/><path d="M20 71C18 52 31 37 50 37S82 52 80 71Z" fill="#040B16"/><circle cx="50" cy="56" r="12" fill="#1B2D45"/></svg>
          <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 3l18 18"/></svg></span>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2 style="margin:0;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:18px;line-height:23px">No pudimos analizar la foto</h2>
          <span style="font-size:14px;line-height:20px">Está muy oscura. Descríbelo con tus palabras y te ayudamos igual.</span>
        </div>
      </div>
      <a href="Falla.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:2px solid #0B5FA5;background:#FFFFFF;color:#0B5FA5;text-decoration:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h3l1.8-2.5h6.4L17 7.5h3a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        <span>Tomar otra foto con linterna</span>
      </a>
    </section>

    <div style="flex-shrink:0;display:flex;flex-direction:column;gap:8px">
      <label for="descripcion-error" style="font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:18px;line-height:23px">Descríbelo con tus palabras</label>
      <span id="ayuda-descripcion" style="font-size:14px;line-height:20px;color:#4B5D73">Cuéntanos qué ves, qué escuchas o qué sientes al manejar.</span>
      <textarea id="descripcion-error" aria-describedby="ayuda-descripcion" rows="4" value="{{texto}}" onChange="{{escribir}}" style="width:100%;min-height:112px;padding:14px 16px;border-radius:16px;border:2px solid #0B5FA5;box-shadow:0 0 0 4px rgba(11,95,165,0.16);background:#FFFFFF;font-size:16px;line-height:23px;resize:none"></textarea>
    </div>

    <fieldset style="flex-shrink:0;margin:0;padding:0;border:0;min-width:0">
      <legend style="padding:0;margin-bottom:10px;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:17px;line-height:22px">¿Qué parte crees que es?</legend>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 14px;border-radius:999px;border:2px solid {{c.borde}};background:{{c.fondo}};color:#0B2340;font-weight:600;font-size:15px;cursor:pointer">
            <sc-if value="{{c.sel}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5FA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></sc-if>
            <span>{{c.label}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>
  </main>

  <div style="flex-shrink:0;padding:12px 20px 28px;background:#FFFFFF;border-top:1px solid #E1E8F0">
    <a href="Analizando.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:16px;background:#0B5FA5;color:#FFFFFF;text-decoration:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:19px;box-shadow:0 6px 16px rgba(11,95,165,0.24)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7.5 12h9"/></svg>
      <span>Analizar con mi descripción</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.chip === undefined ? 'Llanta' : st.chip;
    const opciones = ['Llanta', 'Batería', 'Luz en el tablero', 'Otro'];
    return {
      texto: st.texto === undefined ? 'Sonó un golpe y el timón se jala a la derecha. La llanta de adelante se ve baja.' : st.texto,
      escribir: (e) => this.setState({ texto: e.target.value }),
      chips: opciones.map((label) => ({
        label: label,
        sel: sel === label,
        borde: sel === label ? '#0B5FA5' : '#7A8BA1',
        fondo: sel === label ? '#CFE0F1' : '#FFFFFF',
        pick: () => this.setState({ chip: sel === label ? null : label })
      }))
    };
  }
}
</script>
</body>
</html>
