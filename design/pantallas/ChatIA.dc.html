<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AlToque · Chat con la IA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F7FA;color:#0B2340;font-family:Inter,system-ui,-apple-system,sans-serif">
  <div style="padding:40px 12px 0 8px;flex-shrink:0;background:#FFFFFF">
    <div style="display:flex;align-items:center;gap:4px;height:56px">
      <sc-if value="{{embebido}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{volver}}" aria-label="Volver a la guía" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:#0B2340;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      </sc-if>
      <sc-if value="{{independiente}}" hint-placeholder-val="{{ true }}">
        <a href="Guia.dc.html" aria-label="Volver a la guía" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#0B2340;text-decoration:none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      </sc-if>
      <svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#0B5FA5"/><path d="M18 29s-8-6.6-8-12.5a8 8 0 0 1 16 0C26 22.4 18 29 18 29z" fill="#FFFFFF"/><path d="M14.6 16.4l2.3 2.3 4.5-4.6" fill="none" stroke="#0B5FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 style="margin:0 0 0 6px;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:20px;line-height:26px">Pregúntale a la IA</h1>
    </div>
    <div style="padding:2px 8px 12px 12px">
      <span style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:#CFE0F1;font-size:14px;font-weight:600;line-height:19px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6.5h9M11 12.5h9M11 18.5h9"/></svg>
        {{contexto}}
      </span>
    </div>
  </div>

  <div ref="{{listaRef}}" aria-live="polite" style="flex:1;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px;border-top:1px solid #E1E8F0">
    <sc-for list="{{mensajes}}" as="m" hint-placeholder-count="3">
      <sc-if value="{{m.esIA}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:8px;align-items:flex-end;max-width:92%">
          <svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true" style="flex-shrink:0"><rect width="36" height="36" rx="11" fill="#0B5FA5"/><path d="M18 29s-8-6.6-8-12.5a8 8 0 0 1 16 0C26 22.4 18 29 18 29z" fill="#FFFFFF"/><path d="M14.6 16.4l2.3 2.3 4.5-4.6" fill="none" stroke="#0B5FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:18px 18px 18px 6px;background:#CFE0F1;font-size:16px;line-height:23px">
            <span>{{m.texto}}</span>
            <sc-if value="{{m.guiaBoton}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{m.volver}}" style="min-height:48px;box-sizing:border-box;padding:0 16px;border:0;border-radius:14px;background:#0B5FA5;color:#FFFFFF;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:17px;cursor:pointer">Volver a la guía</button>
            </sc-if>
            <sc-if value="{{m.guiaEnlace}}" hint-placeholder-val="{{ false }}">
              <a href="Guia.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:14px;background:#0B5FA5;color:#FFFFFF;text-decoration:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:17px">Volver a la guía</a>
            </sc-if>
            <sc-if value="{{m.irMecanicos}}" hint-placeholder-val="{{ false }}">
              <a href="Mecanicos.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;background:#0B5FA5;color:#FFFFFF;text-decoration:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:900;font-size:17px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0-5 5.2l-5.6 5.6a1.9 1.9 0 0 0 2.7 2.7l5.6-5.6a4 4 0 0 0 5.2-5l-2.6 2.6-2.5-.4-.4-2.5 2.6-2.6z"/></svg>
                <span>Ver mecánicos cercanos</span>
              </a>
            </sc-if>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{m.esTu}}" hint-placeholder-val="{{ false }}">
        <div style="align-self:flex-end;max-width:80%;padding:12px 14px;border-radius:18px 18px 6px 18px;background:#0B5FA5;color:#FFFFFF;font-size:16px;line-height:23px">{{m.texto}}</div>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex-shrink:0;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border-top:1px solid #E1E8F0">
    <sc-if value="{{haySugerencias}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:13px;font-weight:600;color:#4B5D73">Respuestas rápidas</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{sugerencias}}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{s.elegir}}" style="min-height:48px;box-sizing:border-box;padding:0 16px;border-radius:999px;border:2px solid #0B5FA5;background:#FFFFFF;color:#0B5FA5;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:15px;cursor:pointer">{{s.texto}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <div style="display:flex;gap:8px;align-items:center">
      <label for="duda-ia" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Escribe tu duda</label>
      <input id="duda-ia" type="text" value="{{borrador}}" onChange="{{escribir}}" placeholder="Escribe tu duda" style="flex:1;min-width:0;height:52px;box-sizing:border-box;padding:0 18px;border-radius:999px;border:2px solid #7A8BA1;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;font-size:16px;color:#0B2340">
      <button type="button" onClick="{{enviar}}" aria-label="Enviar" style="width:52px;height:52px;flex-shrink:0;border:0;border-radius:999px;background:#0B5FA5;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5L21 3z"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paso":{"editor":"int","default":3,"min":1,"max":6},"alVolver":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.bajar();
  }
  componentDidUpdate() {
    this.bajar();
  }
  bajar() {
    if (this.lista) this.lista.scrollTop = this.lista.scrollHeight;
  }
  renderVals() {
    const D = {
      1: { titulo: 'Ponte a salvo y señaliza', q: '¿Dónde pongo el triángulo?', a: 'Detrás del auto, en tu mismo carril y lo más lejos que puedas caminar con seguridad. Así los demás autos te ven a tiempo.' },
      2: { titulo: 'Saca el repuesto y las herramientas', q: 'No encuentro la gata', a: 'Suele estar en la maletera, debajo de la alfombra del piso, junto al repuesto. A veces va en un costado, detrás de una tapa.' },
      3: { titulo: 'Afloja los pernos', q: 'Los pernos no se mueven', a: 'Es normal, suelen venir muy ajustados. Pon la llave en horizontal y empuja hacia abajo con el pie, apoyándote en el auto. Gira hacia la izquierda.', q2: '¿Hacia dónde es la izquierda?', a2: 'Mirando la llanta de frente, gira al revés de las agujas del reloj.' },
      4: { titulo: 'Levanta el auto con la gata', q: '¿Dónde pongo la gata?', a: 'Busca una muesca o flecha en el borde de abajo del auto, cerca de la llanta pinchada. Ese es el punto de apoyo: ahí va la gata.' },
      5: { titulo: 'Cambia la llanta', q: 'El repuesto no entra', a: 'Alinea los huecos del repuesto con los tornillos de la rueda. Si no llega a la altura, sube la gata una o dos vueltas más.' },
      6: { titulo: 'Baja el auto y ajusta en cruz', q: '¿Qué tan fuerte ajusto?', a: 'Lo más fuerte que puedas con la llave, sin saltar encima. Después, pide en un grifo que revisen la presión del repuesto.' }
    };
    const paso = Math.min(6, Math.max(1, Number(this.props.paso) || 3));
    const d = D[paso];
    const embebido = typeof this.props.alVolver === 'function';
    const volver = () => { if (embebido) this.props.alVolver(); };
    const st = this.state || {};
    const saludo = { de: 'ia', texto: 'Hola, aquí estoy. ¿Qué duda tienes con este paso?' };
    const msgs = st.msgs || (embebido ? [saludo] : [saludo, { de: 'tu', texto: d.q }, { de: 'ia', texto: d.a }]);
    const etapa = st.etapa || (embebido ? 'inicio' : 'respondida');
    const usadaQ2 = !!st.usadaQ2;
    const agregar = (nuevos, sig, extra) => this.setState(Object.assign({ msgs: msgs.concat(nuevos), etapa: sig }, extra || {}));
    const aMecanico = { de: 'ia', texto: 'No te preocupes, no tienes que hacerlo por tu cuenta. Un mecánico verificado puede llegar en minutos.', accion: 'mecanicos' };
    const bien = { de: 'ia', texto: '¡Muy bien! Sigue con la guía cuando quieras.', accion: 'guia' };
    const preguntaExtra = () => agregar([{ de: 'tu', texto: d.q2 }, { de: 'ia', texto: d.a2 }], 'respondida', { usadaQ2: true });
    const sugerencias = [];
    if (etapa === 'inicio') {
      sugerencias.push({ texto: d.q, elegir: () => agregar([{ de: 'tu', texto: d.q }, { de: 'ia', texto: d.a }], 'respondida') });
      if (d.q2 && !usadaQ2) sugerencias.push({ texto: d.q2, elegir: preguntaExtra });
      sugerencias.push({ texto: 'Prefiero que venga un mecánico', elegir: () => agregar([{ de: 'tu', texto: 'Prefiero que venga un mecánico' }, aMecanico], 'fin') });
    } else if (etapa === 'respondida') {
      sugerencias.push({ texto: '¡Listo, ya pude!', elegir: () => agregar([{ de: 'tu', texto: '¡Listo, ya pude!' }, bien], 'fin') });
      sugerencias.push({ texto: 'Sigo sin poder', elegir: () => agregar([{ de: 'tu', texto: 'Sigo sin poder' }, aMecanico], 'fin') });
      if (d.q2 && !usadaQ2) sugerencias.push({ texto: d.q2, elegir: preguntaExtra });
    }
    const borrador = st.borrador || '';
    if (!this.listaRef) this.listaRef = (el) => { this.lista = el; };
    return {
      embebido: embebido,
      independiente: !embebido,
      volver: volver,
      contexto: 'Paso ' + paso + ' de 6 · ' + d.titulo,
      listaRef: this.listaRef,
      mensajes: msgs.map((m) => ({
        texto: m.texto,
        esIA: m.de === 'ia',
        esTu: m.de === 'tu',
        guiaBoton: m.accion === 'guia' && embebido,
        guiaEnlace: m.accion === 'guia' && !embebido,
        irMecanicos: m.accion === 'mecanicos',
        volver: volver
      })),
      haySugerencias: sugerencias.length > 0,
      sugerencias: sugerencias,
      borrador: borrador,
      escribir: (e) => this.setState({ borrador: e.target.value }),
      enviar: () => {
        const t = borrador.trim();
        if (!t) return;
        agregar([{ de: 'tu', texto: t }, { de: 'ia', texto: 'Gracias por contarme. Si no te sientes con confianza, lo más seguro es que lo vea un mecánico.', accion: 'mecanicos' }], 'fin', { borrador: '' });
      }
    };
  }
}
</script>
</body>
</html>
